[project]
name = "AudioBookGenerator"
authors = [{name = "John Behrend"}]
version = "0.1.0"
description = "A LLM based epub to audiobook generator."

requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    # torchaudio>=2.9 delegates audio I/O to torchcodec (undeclared at runtime)
    "torchcodec>=0.13",
    "torchvision>=0.20.0",
    "transformers>=5.0.0",
    "faster-whisper>=1.1.1",
    "openai>=1.0.0",
    "pydub",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "gradio>=4.0.0",
    "ebooklib>=0.18.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.21.0",
    "yt-dlp>=2026.6.9",
    "soundfile>=0.12.0",
    # ChunkFormer voice validation (gender/emotion/dialect/age classification)
    "chunkformer>=1.2.2",
]

[project.scripts]
audiobook-interface = "audiobook_generator.audiobook_generator:main"


[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["audiobook_generator*", "tts*"]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'aifc' is deprecated:DeprecationWarning",
    "ignore:'sunau' is deprecated:DeprecationWarning",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'win32'" },
  { index = "pypi", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform != 'win32'" },
  { index = "pypi", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform != 'win32'" },
  { index = "pypi", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = false


