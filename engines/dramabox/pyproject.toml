[project]
name = "dramabox-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "pydantic==2.10.6",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "av>=12.0.0",
    "einops>=0.7.0",
    "PyYAML>=6.0",
    "sentencepiece>=0.1.99",
    "transformers>=4.45.0",
    "huggingface-hub>=0.20.0,<1.0",
    "bitsandbytes>=0.45.0",
    "soundfile>=0.12.0",
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
