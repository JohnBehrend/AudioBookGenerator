[project]
name = "breeze-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "transformers==4.57.3",
    "qwen-tts==0.1.1",
    "numpy>=2.0",
    "soundfile>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
